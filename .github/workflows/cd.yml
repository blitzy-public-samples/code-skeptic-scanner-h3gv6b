name: Continuous Deployment

on:
  workflow_run:
    # This string must equal the `name:` of .github/workflows/ci.yml byte for byte, or no
    # workflow_run event is produced and this workflow never starts - see
    # backend/docs/DECISION_LOG.md DL-102
    workflows: ["Code Skeptic Scanner CI"]
    branches: [main]
    types:
      - completed

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  BACKEND_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/code-skeptic-backend
  FRONTEND_BUCKET: ${{ secrets.GCP_FRONTEND_BUCKET }}
  # Read by the notification step, which is skipped when the secret is unset - see
  # backend/docs/DECISION_LOG.md DL-310
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    # Every `uses:` in this file names a full commit SHA, with the release it belongs to in the
    # trailing comment - see backend/docs/DECISION_LOG.md DL-310
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # setup-gcloud v3 accepts neither `service_account_key` nor `export_default_credentials`, so the
    # credential is supplied by this step instead; the secret names are unchanged - see
    # backend/docs/DECISION_LOG.md DL-310
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Authenticate with Google Cloud
      run: gcloud auth configure-docker

    # -f names a Dockerfile outside the ./backend build context, which the retired command omitted so
    # no image could be built at all - see backend/docs/DECISION_LOG.md DL-053, DL-056
    - name: Build and push backend Docker image
      run: |
        docker build -t $BACKEND_IMAGE -f infrastructure/docker/Dockerfile.backend ./backend
        docker push $BACKEND_IMAGE

    - name: Deploy backend to Google Cloud Run
      run: |
        gcloud run deploy code-skeptic-backend \
          --image $BACKEND_IMAGE \
          --platform managed \
          --region us-central1 \
          --allow-unauthenticated

    - name: Build frontend
      run: |
        cd frontend
        npm install
        npm run build

    - name: Deploy frontend to Google Cloud Storage
      run: |
        gsutil -m rsync -r frontend/build gs://$FRONTEND_BUCKET

    - name: Set up Cloud CDN
      run: |
        gcloud compute backend-buckets create code-skeptic-frontend \
          --gcs-bucket-name=$FRONTEND_BUCKET \
          --enable-cdn

    - name: Run post-deployment tests
      run: |
        # HUMAN ASSISTANCE NEEDED
        # Add post-deployment test commands here
        # Example: npm run test:e2e

    # 8398a7/action-slack is an archived repository. The notification is posted directly instead, so
    # this workflow carries no unmaintained third-party action and nothing here needs pinning. The
    # webhook is read from the environment rather than interpolated into the command - see
    # backend/docs/DECISION_LOG.md DL-310
    - name: Notify team of successful deployment
      if: success() && env.SLACK_WEBHOOK != ''
      run: |
        curl --fail --silent --show-error \
          --request POST \
          --header 'Content-Type: application/json' \
          --data '{"text":"Deployment to production completed successfully!"}' \
          "$SLACK_WEBHOOK"