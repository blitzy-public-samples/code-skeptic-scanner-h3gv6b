name: Code Skeptic Scanner CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Every `uses:` in this file names a full commit SHA, with the release it belongs to in the
    # trailing comment. A tag is a movable reference; a SHA is not - see
    # backend/docs/DECISION_LOG.md DL-310
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Replaces the retired Python 3.9 toolchain step - see backend/docs/DECISION_LOG.md DL-004,
    # DL-005
    - name: Set up JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '14'

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run frontend linting and type checking
      working-directory: ./frontend
      run: |
        npm run lint
        npm run type-check

    # Replaces the retired Python dependency-install, lint, type-check, test and packaging steps of
    # this job - see backend/docs/DECISION_LOG.md DL-004, DL-057
    - name: Build and test backend
      working-directory: ./backend
      run: mvn -B clean verify

    - name: Run frontend tests
      working-directory: ./frontend
      run: npm test

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    # HUMAN ASSISTANCE NEEDED
    # The following step requires configuration for your specific staging environment.
    # Please replace with the appropriate deployment commands for your setup.
    - name: Deploy to staging
      run: |
        # Add your deployment commands here
        echo "Deploying to staging environment"