name: Code Skeptic Scanner CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    # Replaces the retired Python 3.9 toolchain step - see backend/docs/DECISION_LOG.md DL-004,
    # DL-005
    # Pinned to a full commit SHA on the node24 runtime line - see
    # backend/docs/DECISION_LOG.md DL-103
    - name: Set up JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        # 22.23.2 meets the mandatory Node.js floor of 22.12.0 on the 22.x line and matches the
        # version installed on the build host - see backend/docs/DECISION_LOG.md DL-285
        node-version: '22.23.2'

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run frontend linting and type checking
      working-directory: ./frontend
      run: |
        npm run lint
        npm run type-check

    # Replaces the retired Python dependency-install, lint, type-check, test and packaging steps of
    # this job - see backend/docs/DECISION_LOG.md DL-004, DL-057
    - name: Build and test backend
      working-directory: ./backend
      run: mvn -B clean verify

    - name: Run frontend tests
      working-directory: ./frontend
      run: npm test

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    # HUMAN ASSISTANCE NEEDED
    # The following step requires configuration for your specific staging environment.
    # Please replace with the appropriate deployment commands for your setup.
    - name: Deploy to staging
      run: |
        # Add your deployment commands here
        echo "Deploying to staging environment"