name: Code Skeptic Scanner CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    # Replaces the retired Python 3.9 toolchain step - see backend/docs/DECISION_LOG.md DL-004,
    # DL-005
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run frontend linting and type checking
      working-directory: ./frontend
      run: |
        npm run lint
        npm run type-check

    # Replaces the retired Python dependency-install, lint, type-check, test and packaging steps of
    # this job - see backend/docs/DECISION_LOG.md DL-004, DL-057
    - name: Build and test backend
      working-directory: ./backend
      run: mvn -B clean verify

    - name: Run frontend tests
      working-directory: ./frontend
      run: npm test

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    # HUMAN ASSISTANCE NEEDED
    # The following step requires configuration for your specific staging environment.
    # Please replace with the appropriate deployment commands for your setup.
    - name: Deploy to staging
      run: |
        # Add your deployment commands here
        echo "Deploying to staging environment"