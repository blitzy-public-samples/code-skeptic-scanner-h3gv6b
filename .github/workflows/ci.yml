name: Code Skeptic Scanner CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        # Raised from '14' to satisfy the mandatory Node.js floor
        # (>= 20.20.2 on the 20.x line, >= 22.12.0 on the 22.x line).
        # Matches the Node.js version installed on the development host.
        node-version: '22.23.2'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run backend linting and type checking
      run: |
        pip install flake8 mypy
        flake8 backend
        mypy backend

    - name: Run frontend linting and type checking
      working-directory: ./frontend
      run: |
        npm run lint
        npm run type-check

    - name: Run backend tests
      run: |
        pip install pytest
        pytest backend/tests

    - name: Run frontend tests
      working-directory: ./frontend
      run: npm test

    - name: Build backend
      run: |
        pip install build
        python -m build

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    # HUMAN ASSISTANCE NEEDED
    # The following step requires configuration for your specific staging environment.
    # Please replace with the appropriate deployment commands for your setup.
    - name: Deploy to staging
      run: |
        # Add your deployment commands here
        echo "Deploying to staging environment"