# Yamllint policy for this repository - see backend/docs/DECISION_LOG.md DL-276
#
# Every rule that can detect a defect is kept at error. Bracket spacing, sequence indentation and
# trailing-comment spacing are all held at the default preset's own setting, so the delivered YAML
# reads the way yamllint's default reads it. Three relaxations remain, each naming a convention every
# delivered YAML file holds to:
#
#   document-start   GitHub Actions workflows, Dependabot config and Spring profiles are single
#                    documents and none carries a "---" marker.
#   truthy           A workflow's trigger key is spelled "on", which the YAML 1.1 resolver reads as
#                    a boolean. Values are still checked; keys are not.
#   line-length      Comment blocks carry provenance paths and decision pointers; 170 characters
#                    bounds them while still catching a runaway line.

extends: default

rules:
  document-start: disable

  truthy:
    check-keys: false
    level: error

  # Default spacing: a flow sequence carries no space inside its brackets.
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0
    level: error

  # Default indentation: a block sequence is indented one level below its key.
  indentation:
    spaces: consistent
    indent-sequences: true
    check-multi-line-strings: false
    level: error

  # Default comment spacing: a trailing comment is separated from content by two spaces.
  comments:
    require-starting-space: true
    ignore-shebangs: true
    min-spaces-from-content: 2
    level: error

  comments-indentation: disable

  line-length:
    max: 170
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
    level: error

  # Defect detection, all kept at error
  key-duplicates:
    level: error
  trailing-spaces:
    level: error
  new-line-at-end-of-file:
    level: error
  empty-values:
    forbid-in-block-mappings: true
    forbid-in-flow-mappings: true
    level: error
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
    level: error
  colons:
    level: error
  commas:
    level: error
  hyphens:
    level: error
  anchors:
    level: error
  empty-lines:
    max: 2
    level: error
