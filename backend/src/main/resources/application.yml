# Ported from backend/app/core/config.py:L4-15 (faithful port) — see docs/DECISION_LOG.md

# Ported from backend/app/main.py:L53 (faithful port) — DL-029 — see docs/DECISION_LOG.md
server:
  port: ${PORT:5000}
  # Net-new (no Python counterpart) — DL-293 — see docs/DECISION_LOG.md
  # Under this strategy HttpServletRequest.isSecure() reports the forwarded X-Forwarded-Proto scheme,
  # which is the value the Strict-Transport-Security writer declared on the chain by
  # security/SecurityConfig reads.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  # Net-new (no Python counterpart) — DL-238 — see docs/DECISION_LOG.md
  # The embedded container's own default, declared explicitly. Request headers above this size are
  # rejected by the connector before any filter runs.
  max-http-request-header-size: ${MAX_HTTP_REQUEST_HEADER_SIZE:8KB}
  # Net-new (no Python counterpart) — DL-294 — see docs/DECISION_LOG.md
  # The connector stops accepting requests and drains those already in flight before the context
  # closes; the connection pool config/DataSourceConfig publishes closes after that drain completes.
  # The drain is bounded by spring.lifecycle.timeout-per-shutdown-phase below.
  shutdown: ${SERVER_SHUTDOWN:graceful}

# Net-new (the retired tree configured no logging framework) — DL-052, DL-206 — see
# docs/DECISION_LOG.md
# The level of the application logger, which is the level the DEBUG diagnostics of the ingestion,
# scheduling and adapter paths are emitted at. It is the only logging key in the tree and there is no
# logback or log4j document.
logging:
  level:
    com.codeskeptic.scanner: ${SCANNER_LOG_LEVEL:INFO}

# Ported from backend/app/main.py:L15-39 and backend/app/db/database.py:L5-13 (faithful port) — see docs/DECISION_LOG.md
spring:
  main:
    # Net-new (no Python counterpart) — DL-030 — see docs/DECISION_LOG.md
    web-application-type: servlet
  # Net-new (no Python counterpart) — DL-294 — see docs/DECISION_LOG.md
  # Ceiling on the graceful drain configured by server.shutdown above. A request still in flight at
  # this bound is abandoned and shutdown proceeds, so a stuck request cannot hold the process open.
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_GRACE_PERIOD:30s}
  # spring.datasource.* — not read; the connection identity comes from scanner.database-url and the
  # pool takes the HikariCP defaults — DL-027, DL-270 — see docs/DECISION_LOG.md
  # spring.jackson.property-naming-strategy — not set — DL-022 — see docs/DECISION_LOG.md
  # spring.jackson.parser.* — not set: no parser feature is enabled beyond the framework default, so a
  # request body carrying a repeated member binds exactly as the free-form request.json of the retired
  # handlers did — DL-188 — see docs/DECISION_LOG.md
  jpa:
    hibernate:
      # Net-new (no Python counterpart) — DL-026 — see docs/DECISION_LOG.md
      ddl-auto: update
    # Net-new (no Python counterpart) — DL-026 — see docs/DECISION_LOG.md
    open-in-view: false
    # spring.jpa.database-platform — not set — DL-027 — see docs/DECISION_LOG.md
    properties:
      hibernate:
        # Net-new (no Python counterpart); quotes the reserved-word columns key and value at
        # backend/app/db/models.py:L42-43 — DL-061 — see docs/DECISION_LOG.md
        auto_quote_keyword: true

scanner:
  # Ported from backend/app/core/config.py:L9 and backend/app/db/database.py:L7 (faithful port) — DL-027 — see docs/DECISION_LOG.md
  database-url: ${DATABASE_URL}

  # Ported from backend/app/core/config.py:L10 and backend/app/services/twitter_service.py:L43,L46 (faithful port) — see docs/DECISION_LOG.md
  popularity-threshold: ${TWEET_POPULARITY_THRESHOLD:100}
  # Ported from backend/app/core/config.py:L11 and backend/app/tasks/response_generation.py:L50 (faithful port) — see docs/DECISION_LOG.md
  response-generation-delay-seconds: ${RESPONSE_GENERATION_DELAY:60}

  twitter:
    # Ported from backend/app/core/config.py:L5-6 (faithful port) — see docs/DECISION_LOG.md
    api-key: ${TWITTER_API_KEY:}
    api-secret: ${TWITTER_API_SECRET:}
    # Ported from backend/app/services/twitter_service.py:L12 (faithful port) — DL-031 — see docs/DECISION_LOG.md
    api-secret-key: ${TWITTER_API_SECRET_KEY:${TWITTER_API_SECRET:}}
    # Ported from backend/app/tasks/tweet_monitoring.py:L46-47 (faithful port) — DL-031 — see docs/DECISION_LOG.md
    consumer-key: ${TWITTER_CONSUMER_KEY:${TWITTER_API_KEY:}}
    consumer-secret: ${TWITTER_CONSUMER_SECRET:${TWITTER_API_SECRET:}}
    # Ported from backend/app/services/twitter_service.py:L13 and backend/app/tasks/tweet_monitoring.py:L48-49 (faithful port) — DL-046 — see docs/DECISION_LOG.md
    access-token: ${TWITTER_ACCESS_TOKEN:}
    access-token-secret: ${TWITTER_ACCESS_TOKEN_SECRET:}
    # Net-new (no Python counterpart) — DL-230 — see docs/DECISION_LOG.md
    # Bounds the app-only token exchange and the stream-rules calls. The filtered-stream
    # subscription is not bounded by it. A value below 1 is read as 1 second.
    request-timeout-seconds: ${TWITTER_REQUEST_TIMEOUT_SECONDS:10}

  notion:
    # Ported from backend/app/core/config.py:L7 and backend/app/services/notion_service.py:L8 (faithful port) — see docs/DECISION_LOG.md
    api-key: ${NOTION_API_KEY:}
    # Ported from backend/app/services/notion_service.py:L24,L35 (faithful port) — see docs/DECISION_LOG.md
    database-id: ${NOTION_DATABASE_ID:}
    # Net-new (no Python counterpart) — DL-151 — see docs/DECISION_LOG.md
    api-version: ${NOTION_API_VERSION:2022-06-28}
    # Net-new (no Python counterpart) — DL-150 — see docs/DECISION_LOG.md
    connect-timeout-seconds: ${NOTION_CONNECT_TIMEOUT_SECONDS:5}
    # Net-new (no Python counterpart) — DL-150 — see docs/DECISION_LOG.md
    read-timeout-seconds: ${NOTION_READ_TIMEOUT_SECONDS:10}
    # Net-new (no Python counterpart) — DL-253 — see docs/DECISION_LOG.md
    # Retries a mirror write makes after its first attempt, and the wait before the first retry which
    # doubles before each later one. Only a retryable answer is retried: 429, a 5xx status and a
    # transport failure.
    mirror-max-retries: ${NOTION_MIRROR_MAX_RETRIES:2}
    mirror-retry-backoff-millis: ${NOTION_MIRROR_RETRY_BACKOFF_MILLIS:500}

  openai:
    # Ported from backend/app/core/config.py:L8 and backend/app/services/llm_service.py:L9 (faithful port) — see docs/DECISION_LOG.md
    api-key: ${OPENAI_API_KEY:}
    # Net-new (no Python counterpart) — DL-033 — see docs/DECISION_LOG.md
    model: gpt-5.6-terra
    # Ported from backend/app/services/llm_service.py:L22 (faithful port) — DL-034, DL-202 — see docs/DECISION_LOG.md
    # Source value: 150, carried unchanged. The whole budget is available to visible output while
    # scanner.openai.reasoning-effort is none.
    max-completion-tokens: ${OPENAI_MAX_COMPLETION_TOKENS:150}
    # Ported from backend/app/services/llm_service.py:L25 (faithful port) — DL-200 — see docs/DECISION_LOG.md
    # Source value: 0.7, carried unchanged. Accepted range: 0 to 2 inclusive. An empty value omits
    # the parameter altogether. Carrying a value while scanner.openai.reasoning-effort names an
    # effort other than none is refused before the request is built — DL-145.
    temperature: ${OPENAI_TEMPERATURE:0.7}
    # Ported from backend/app/services/llm_service.py:L23 (faithful port) — see docs/DECISION_LOG.md
    n: ${OPENAI_N:1}
    # Net-new (no Python counterpart) — DL-145 — see docs/DECISION_LOG.md
    # Accepted values: none, low, medium, high, xhigh, max. A blank value omits the parameter. Any
    # other value, minimal included, refuses to build the request. Only none permits an explicit
    # scanner.openai.temperature — DL-145.
    reasoning-effort: ${OPENAI_REASONING_EFFORT:none}
    # Net-new (no Python counterpart) — DL-146 — see docs/DECISION_LOG.md
    # Accepted range: 1 second or greater.
    request-timeout-seconds: ${OPENAI_REQUEST_TIMEOUT_SECONDS:30}
    # Net-new (no Python counterpart) — DL-146, DL-201 — see docs/DECISION_LOG.md
    # Accepted range: 0 or greater; 0 disables retrying.
    max-retries: ${OPENAI_MAX_RETRIES:2}

  jwt:
    # Ported from backend/app/core/security.py:L11 (faithful port) — DL-016, DL-184, DL-185, DL-186 — see docs/DECISION_LOG.md
    # Carries the HS256 key material as text, which is the contract of the PyJWT call at
    # backend/app/core/security.py:L11: the value's UTF-8 bytes are the key material and must number
    # at least 32. No encoding is applied or expected; any character a configuration value can carry
    # is accepted. Startup fails for material below that floor. Generate one with
    # `openssl rand -base64 32`.
    # Declared with no default: SECRET_KEY must be supplied. Startup fails when it is unset, blank or
    # still the unresolved text ${SECRET_KEY}.
    secret: ${SECRET_KEY}
    # Ported from backend/app/core/security.py:L11 (faithful port) — DL-015, DL-108, DL-184 — see docs/DECISION_LOG.md
    # Accepted value: HS256, in any letter case. Any other value — HS384, HS512, RS256, none — refuses
    # to start. Blank keeps HS256.
    algorithm: ${ALGORITHM:HS256}
    # Ported from backend/app/core/security.py:L9-10 (faithful port) — DL-017, DL-142 — see docs/DECISION_LOG.md
    # Accepted range: 1 to 60 minutes inclusive. Startup fails outside it.
    expiration-minutes: 60

  auth:
    # Net-new (no Python counterpart) — DL-020 — see docs/DECISION_LOG.md
    username: ${AUTH_USERNAME:admin}
    # Net-new (no Python counterpart) — DL-020 — see docs/DECISION_LOG.md
    # bcrypt hash, declared with no default: AUTH_PASSWORD_HASH must be supplied.
    password-hash: ${AUTH_PASSWORD_HASH}

  analytics:
    # Net-new (no Python counterpart) — DL-042 — see docs/DECISION_LOG.md
    trend-window-days: 30

  ingestion:
    # Net-new (no Python counterpart) — DL-044 — see docs/DECISION_LOG.md
    stream-base-keywords:
      - AI coding tool
      - AI code assistant
      - AI generated code
      - GPT-4
    # Number of stream rules the account tier accepts — DL-254 — see docs/DECISION_LOG.md
    max-stream-rules: ${TWITTER_MAX_STREAM_RULES:25}
    # Span without any byte from the stream after which the connection is treated as dead — DL-256
    stream-idle-timeout-seconds: ${TWITTER_STREAM_IDLE_TIMEOUT_SECONDS:60}

  background:
    # Net-new (no Python counterpart) — DL-250 — see docs/DECISION_LOG.md
    # Which background paths this process runs. A path runs only when `enabled` and that path's own
    # switch both hold. Every process of a multi-replica deployment other than the designated
    # background worker sets `enabled` to false.
    enabled: ${SCANNER_BACKGROUND_ENABLED:true}
    stream-enabled: ${TWITTER_STREAM_ENABLED:true}
    response-generation-enabled: ${RESPONSE_GENERATION_ENABLED:true}
    # Net-new (no Python counterpart) — DL-282 — see docs/DECISION_LOG.md
    # Candidates one generation pass attempts, whatever the backlog holds. Accepted: 1 or more.
    max-candidates-per-pass: ${RESPONSE_GENERATION_MAX_CANDIDATES_PER_PASS:200}
