# Ported from backend/app/core/config.py:L4-15 (faithful port) — see docs/DECISION_LOG.md

# Ported from backend/app/main.py:L53 (faithful port) — DL-029 — see docs/DECISION_LOG.md
server:
  port: ${PORT:5000}
  # Net-new (no Python counterpart) — see docs/DECISION_LOG.md
  # The platform terminates TLS and forwards X-Forwarded-Proto. With this strategy the request
  # reports the forwarded scheme, so HttpServletRequest.isSecure() is true behind that terminator and
  # Spring Security's Strict-Transport-Security writer emits its header.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

# Net-new (the retired tree configured no logging framework) — DL-052 — see docs/DECISION_LOG.md
# Spring Boot's default root level is INFO. This key names the application logger explicitly so the
# DEBUG diagnostics of the ingestion, scheduling and adapter paths are reachable by configuration
# alone, without a logback or log4j document.
logging:
  level:
    com.codeskeptic.scanner: ${SCANNER_LOG_LEVEL:INFO}

# Ported from backend/app/main.py:L15-39 and backend/app/db/database.py:L5-13 (faithful port) — see docs/DECISION_LOG.md
spring:
  main:
    # Net-new (no Python counterpart) — DL-030 — see docs/DECISION_LOG.md
    web-application-type: servlet
  # spring.datasource.url / .username / .password / .driver-class-name — not set — DL-027 — see docs/DECISION_LOG.md
  # spring.jackson.property-naming-strategy — not set — DL-022 — see docs/DECISION_LOG.md
  jackson:
    parser:
      # Net-new (no Python counterpart) — DL-188 — see docs/DECISION_LOG.md
      # A request body repeating a member is reported as unreadable input, answering
      # 400 {"error": "Bad request"}.
      strict-duplicate-detection: true
  jpa:
    hibernate:
      # Net-new (no Python counterpart) — DL-026 — see docs/DECISION_LOG.md
      ddl-auto: update
    # Net-new (no Python counterpart) — DL-026 — see docs/DECISION_LOG.md
    open-in-view: false
    # spring.jpa.database-platform — not set — DL-027 — see docs/DECISION_LOG.md
    properties:
      hibernate:
        # Net-new (no Python counterpart); quotes the reserved-word columns key and value at
        # backend/app/db/models.py:L42-43 — DL-061 — see docs/DECISION_LOG.md
        auto_quote_keyword: true

scanner:
  # Ported from backend/app/core/config.py:L9 and backend/app/db/database.py:L7 (faithful port) — DL-027 — see docs/DECISION_LOG.md
  database-url: ${DATABASE_URL}
  # Ported from backend/app/core/config.py:L10 and backend/app/services/twitter_service.py:L43,L46 (faithful port) — see docs/DECISION_LOG.md
  popularity-threshold: ${TWEET_POPULARITY_THRESHOLD:100}
  # Ported from backend/app/core/config.py:L11 and backend/app/tasks/response_generation.py:L50 (faithful port) — see docs/DECISION_LOG.md
  response-generation-delay-seconds: ${RESPONSE_GENERATION_DELAY:60}

  twitter:
    # Ported from backend/app/core/config.py:L5-6 (faithful port) — see docs/DECISION_LOG.md
    api-key: ${TWITTER_API_KEY:}
    api-secret: ${TWITTER_API_SECRET:}
    # Ported from backend/app/services/twitter_service.py:L12 (faithful port) — DL-031 — see docs/DECISION_LOG.md
    api-secret-key: ${TWITTER_API_SECRET_KEY:${TWITTER_API_SECRET:}}
    # Ported from backend/app/tasks/tweet_monitoring.py:L46-47 (faithful port) — DL-031 — see docs/DECISION_LOG.md
    consumer-key: ${TWITTER_CONSUMER_KEY:${TWITTER_API_KEY:}}
    consumer-secret: ${TWITTER_CONSUMER_SECRET:${TWITTER_API_SECRET:}}
    # Ported from backend/app/services/twitter_service.py:L13 and backend/app/tasks/tweet_monitoring.py:L48-49 (faithful port) — DL-046 — see docs/DECISION_LOG.md
    access-token: ${TWITTER_ACCESS_TOKEN:}
    access-token-secret: ${TWITTER_ACCESS_TOKEN_SECRET:}

  notion:
    # Ported from backend/app/core/config.py:L7 and backend/app/services/notion_service.py:L8 (faithful port) — see docs/DECISION_LOG.md
    api-key: ${NOTION_API_KEY:}
    # Ported from backend/app/services/notion_service.py:L24,L35 (faithful port) — see docs/DECISION_LOG.md
    database-id: ${NOTION_DATABASE_ID:}
    # Net-new (no Python counterpart) — DL-151 — see docs/DECISION_LOG.md
    api-version: ${NOTION_API_VERSION:2022-06-28}
    # Net-new (no Python counterpart) — DL-150 — see docs/DECISION_LOG.md
    connect-timeout-seconds: ${NOTION_CONNECT_TIMEOUT_SECONDS:5}
    # Net-new (no Python counterpart) — DL-150 — see docs/DECISION_LOG.md
    read-timeout-seconds: ${NOTION_READ_TIMEOUT_SECONDS:10}

  openai:
    # Ported from backend/app/core/config.py:L8 and backend/app/services/llm_service.py:L9 (faithful port) — see docs/DECISION_LOG.md
    api-key: ${OPENAI_API_KEY:}
    # Net-new (no Python counterpart) — DL-033 — see docs/DECISION_LOG.md
    model: gpt-5.6-terra
    # Ported from backend/app/services/llm_service.py:L22; source literal 150, configured default
    # 1000 — DL-034, DL-202 — see docs/DECISION_LOG.md
    max-completion-tokens: ${OPENAI_MAX_COMPLETION_TOKENS:1000}
    # Ported from backend/app/services/llm_service.py:L25; source literal 0.7. The key has no default;
    # when supplied, its accepted range is 0 to 2 inclusive — DL-200 — see docs/DECISION_LOG.md
    # Ported from backend/app/services/llm_service.py:L23 (faithful port) — see docs/DECISION_LOG.md
    n: ${OPENAI_N:1}
    # Net-new (no Python counterpart) — DL-145 — see docs/DECISION_LOG.md
    # Accepted by the configured model: none, low, medium, high, xhigh; blank omits the parameter.
    reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
    # Net-new (no Python counterpart) — DL-146 — see docs/DECISION_LOG.md
    # Accepted range: 1 second or greater.
    request-timeout-seconds: ${OPENAI_REQUEST_TIMEOUT_SECONDS:30}
    # Net-new (no Python counterpart) — DL-146, DL-201 — see docs/DECISION_LOG.md
    # Accepted range: 0 or greater; 0 disables retrying.
    max-retries: ${OPENAI_MAX_RETRIES:2}

  jwt:
    # Ported from backend/app/core/security.py:L11 (faithful port) — DL-016, DL-141, DL-184, DL-185 — see docs/DECISION_LOG.md
    # Minimum length: 32 bytes. Startup fails below it.
    # Declared with no default: SECRET_KEY must be supplied. Startup fails when it is unset, blank or
    # still the unresolved text ${SECRET_KEY}.
    secret: ${SECRET_KEY}
    # Ported from backend/app/core/security.py:L11 (faithful port) — DL-015, DL-141, DL-184 — see docs/DECISION_LOG.md
    # Accepted value: HS256, in any letter case. Any other value — HS384, HS512, RS256, none — refuses
    # to start. Blank keeps HS256.
    algorithm: ${ALGORITHM:HS256}
    # Ported from backend/app/core/security.py:L9-10 (faithful port) — DL-017, DL-142 — see docs/DECISION_LOG.md
    # Accepted range: 1 to 60 minutes inclusive. Startup fails outside it.
    expiration-minutes: 60

  auth:
    # Net-new (no Python counterpart) — DL-020 — see docs/DECISION_LOG.md
    username: ${AUTH_USERNAME:admin}
    # Net-new (no Python counterpart) — DL-020 — see docs/DECISION_LOG.md
    # bcrypt hash, declared with no default: AUTH_PASSWORD_HASH must be supplied.
    password-hash: ${AUTH_PASSWORD_HASH}

  analytics:
    # Net-new (no Python counterpart) — DL-042 — see docs/DECISION_LOG.md
    trend-window-days: 30

  ingestion:
    # Net-new (no Python counterpart) — DL-044 — see docs/DECISION_LOG.md
    stream-base-keywords:
      - AI coding tool
      - AI code assistant
      - AI generated code
      - GPT-4
